<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografias</title>
    <link rel="stylesheet" href="../model/index.css">
</head>

<body>
    <!--Header com as 3 seções-->
    <header>
        <div class="Seção-usuário">
            <img class="perfil-de-usuário" src="../imagens_usuarios/saepVision.jpeg" alt="Imagem de perfil do SAEPVision">
            <p>@SAEPVision</p>
            <button>
                <p>Ver Perfil</p>
            </button>
        </div>

        <div class="Seção-empresa">
            <h1>SAEPVision</h1>
        </div>

        <div class="Seção-de-login">
            <button>
                <p>Entrar</p>
            </button>
        </div>
    </header>

    <!--Section com a barra de pesquisa e as imagens-->
    <section>

        <!--Barra de pesquisa-->
        <div class="barra-de-pesquisa">
            <form action="">
                <label for="Campo-de-Busca"></label>
                <input type="text" placeholder="Digite o nome do fotógrafo... ex: @fotografo1" id="Campo-de-Busca" name="Campo-de-Busca">
            </form>
            <img src="../icones/lupa.svg" alt="Ícone de busca">
        </div>

        <!--Imagens dividido em fileiras (3 imagens por fileira)-->
        <div class="imagens-da-galeria">

            <!--Fileira 1-->
            <div class="primeira-fileira">
                <img src="../fotografias/foto1.jpg" alt="">
                <div>
                    <p>Foto 1</p>
                    <p>@fotografo1</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto2.jpg" alt="">
                <div>
                    <p>Foto 2</p>
                    <p>@fotografo2</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto3.jpg" alt="">
                <div>
                    <p>Foto 3</p>
                    <p>@fotografo3</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
            </div>

            <!--Fileira 2-->
            <div class="segunda-fileira">
                <img src="../fotografias/foto4.jpg" alt="">
                <div>
                    <p>Foto 4</p>
                    <p>@fotografo4</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto5.jpg" alt="">
                <div>
                    <p>Foto 5</p>
                    <p>@fotografo5</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto6.jpg" alt="">
                <div>
                    <p>Foto 6</p>
                    <p>@fotografo6</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
            </div>

            <!--Fileira 3-->
            <div class="terceira-fileira">
                <img src="../fotografias/foto7.jpg" alt="">
                <div>
                    <p>Foto 7</p>
                    <p>@fotografo7</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto8.jpg" alt="">
                <div>
                    <p>Foto 8</p>
                    <p>@fotografo8</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
                <img src="../fotografias/foto9.jpg" alt="">
                <div>
                    <p>Foto 9</p>
                    <p>@fotografo9</p>
                    <img class="coracao" src="../icones/coracao.svg" alt="Icone de coração">
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div>
        <p>SAEPVision</p>
        </div>
        <div class="icones">
            <img src="../icones/instagram.svg" alt="Icone do instagram">
            <img src="../icones/tiktok.svg" alt="Icone do tiktok">
            <img src="../icones/linkedIn.svg" alt="Icone do linkedIn">
            <img src="../icones/youtube.svg" alt="Icone do youtube">
        </div>
        <div>
            <p>Copyright 2026-2027</p>
        </div>
    </footer>
</body>
</html>
